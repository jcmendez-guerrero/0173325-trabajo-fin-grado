name: Terraform Apply

on:
  push:
    branches:
      - main
    paths:
      - "accounts/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  detect:
    name: Detect changed account folders
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.changed.outputs.matrix }}
      has_changes: ${{ steps.changed.outputs.has_changes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Find changed account folders
        id: changed
        run: |
          FOLDERS=$(git diff --name-only HEAD~1 HEAD \
            | grep '^accounts/' \
            | cut -d'/' -f1-2 \
            | sort -u \
            | jq -R . | jq -sc .)

          if [ "$FOLDERS" = "[]" ] || [ -z "$FOLDERS" ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "matrix=[]" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "matrix=$FOLDERS" >> $GITHUB_OUTPUT
          fi

  apply:
    name: Apply — ${{ matrix.folder }}
    needs: detect
    if: needs.detect.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        folder: ${{ fromJson(needs.detect.outputs.matrix) }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Extract account ID from folder name
        id: account
        run: |
          FOLDER_NAME=$(basename "${{ matrix.folder }}")
          ACCOUNT_ID=$(echo "$FOLDER_NAME" | cut -d'-' -f1)
          echo "id=$ACCOUNT_ID" >> $GITHUB_OUTPUT
          echo "role_arn=arn:aws:iam::${ACCOUNT_ID}:role/platform/terraform-execution-role" >> $GITHUB_OUTPUT

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ steps.account.outputs.role_arn }}
          aws-region: eu-south-2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: ${{ matrix.folder }}
        run: terraform init -input=false

      - name: Terraform Validate
        working-directory: ${{ matrix.folder }}
        run: terraform validate

      - name: Terraform Apply
        working-directory: ${{ matrix.folder }}
        run: terraform apply -input=false -auto-approve
