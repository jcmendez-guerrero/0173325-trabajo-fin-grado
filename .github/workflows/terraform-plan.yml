name: Terraform Plan

on:
  pull_request:
    branches:
      - main
    paths:
      - "accounts/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true    
jobs:
  detect:
    name: Detect changed account folders
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.changed.outputs.matrix }}
      has_changes: ${{ steps.changed.outputs.has_changes }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Find changed account folders
        id: changed
        run: |
          FOLDERS=$(git diff --name-only "origin/${GITHUB_BASE_REF}...HEAD" \
            | grep '^accounts/' \
            | cut -d'/' -f1-2 \
            | sort -u \
            | jq -R . | jq -sc .)

          if [ "$FOLDERS" = "[]" ] || [ -z "$FOLDERS" ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "matrix=[]" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "matrix=$FOLDERS" >> "$GITHUB_OUTPUT"
          fi

  plan:
    name: Plan — ${{ matrix.folder }}
    needs: detect
    if: needs.detect.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        folder: ${{ fromJson(needs.detect.outputs.matrix) }}
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Extract account ID from folder name
        id: account
        run: |
          FOLDER_NAME=$(basename "${MATRIX_FOLDER}")
          ACCOUNT_ID=$(echo "$FOLDER_NAME" | cut -d'-' -f1)
          echo "id=$ACCOUNT_ID" >> "$GITHUB_OUTPUT"
          echo "role_arn=arn:aws:iam::${ACCOUNT_ID}:role/platform/terraform-execution-role" >> "$GITHUB_OUTPUT"
        env:
          MATRIX_FOLDER: ${{ matrix.folder }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885 # v6
        with:
          role-to-assume: ${{ steps.account.outputs.role_arn }}
          aws-region: eu-south-2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4

      - name: Terraform Init
        working-directory: ${{ matrix.folder }}
        run: terraform init -input=false

      - name: Terraform Validate
        working-directory: ${{ matrix.folder }}
        run: terraform validate

      - name: Terraform Plan
        id: plan
        working-directory: ${{ matrix.folder }}
        run: |
          terraform plan -input=false -no-color -out=tfplan 2>&1 | tee plan_output.txt
          echo "exitcode=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      - name: Post plan as PR comment
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          MATRIX_FOLDER: ${{ matrix.folder }}
          ACCOUNT_ID: ${{ steps.account.outputs.id }}
          PLAN_EXITCODE: ${{ steps.plan.outputs.exitcode }}
          ROLE_ARN: ${{ steps.account.outputs.role_arn }}
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync(`${process.env.MATRIX_FOLDER}/plan_output.txt`, 'utf8');
            const folder = process.env.MATRIX_FOLDER;
            const exitcode = process.env.PLAN_EXITCODE;
            const status = exitcode === '0' ? '✅ Success' : '❌ Failed';

            const body = `### Terraform Plan — \`${folder}\` ${status}

            <details><summary>Show Plan</summary>

            \`\`\`terraform
            ${output.length > 60000 ? output.slice(0, 60000) + '\n... (truncated)' : output}
            \`\`\`

            </details>

            *Account ID: \`${process.env.ACCOUNT_ID}\` | Role: \`${process.env.ROLE_ARN}\`*`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const marker = `<!-- tf-plan-${folder} -->`;
            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: marker + '\n' + body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: marker + '\n' + body,
              });
            }

      - name: Fail if plan failed
        if: steps.plan.outputs.exitcode != '0'
        run: exit 1

